name: Android CI & APK Build

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK
      run: ./gradlew :app:assembleUserDebug :app:assembleUserRelease

    - name: Prepare Named Release APKs
      run: |
        cp app/build/outputs/apk/user/release/app-user-release.apk app/build/outputs/apk/user/release/Spotify-Kosher.apk
        cp app/build/outputs/apk/user/release/app-user-release.apk app/build/outputs/apk/user/release/Spotify.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Spotify-${{ github.ref_name }}-Debug-APK
        path: app/build/outputs/apk/user/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Spotify-${{ github.ref_name }}-Release-APK
        path: app/build/outputs/apk/user/release/*.apk

    - name: Upload to GitHub Release v2.8
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v2.8 \
          app/build/outputs/apk/user/release/Spotify-Kosher.apk \
          app/build/outputs/apk/user/release/Spotify.apk \
          --clobber || echo "Release upload step finished"
